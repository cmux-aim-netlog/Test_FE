<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 점심 뭐 먹지?</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">오늘 점심 뭐 먹지? 🍱</h1>
      <p class="app__subtitle">버튼을 눌러서 메뉴를 추천받아 보세요.</p>
    </header>

    <section class="picker">
      <div id="result" class="picker__result">?</div>
      <button id="pickBtn" class="btn btn--primary">메뉴 뽑기 🎲</button>
    </section>

    <section class="filters">
      <h2 class="section-title">카테고리</h2>
      <div id="categoryFilters" class="filters__list"></div>
    </section>

    <section class="history">
      <div class="history__head">
        <h2 class="section-title">최근 추천</h2>
        <button id="clearHistoryBtn" class="btn btn--ghost">전체 지우기</button>
      </div>
      <ul id="historyList" class="history__list"></ul>
    </section>
  </main>

  <script src="js/menu-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/history.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
